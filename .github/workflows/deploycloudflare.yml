# Déploiement automatique sur Cloudflare Workers
# Nécessite le secret de dépôt CLOUDFLARE_API_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret)
name: Déployer sur Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: S'assurer que le sous-domaine workers.dev existe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true
        run: |
          ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          echo "Compte : $ACCOUNT_ID"
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            echo "Aucun sous-domaine workers.dev — création de 'dvs-by-mlp'…"
            curl -s -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"subdomain":"dvs-by-mlp"}' \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain"
          else
            echo "Sous-domaine existant : $SUB.workers.dev"
          fi

      - name: Déployer le Worker (crée la base D1 et le KV si besoin)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
